MODEL: "optollama"
RUN: "LEN101_FT_STAGE2"

# --- paths ---
DATA_PATH: "E:/repos/OptoLlama/data"

TOKENS_PATH: "${DATA_PATH}/tokens.json"
MATERIALS_PATH: "${DATA_PATH}/materials/"

# Prepare this folder per curriculum stage. Each shard must have:
#   spectra: [N, 3, W]
#   thin_films: [N, 101]
DATA_PATH_TRAIN_0: "${DATA_PATH}/finetune_len101_stage2"

# Convert the old test split to width 101, or point this to a generated long validation shard.
DATA_PATH_TEST: "${DATA_PATH}/test_len101"

OUTPUT_PATH: "${DATA_PATH}/output_len101"
SAMPLES_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-samples.json"
GRID_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-grid.json"
IDS_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-ids.json"
PLOT_BUNDLE_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-plot-bundle.npz"
PLOT_SAMPLE_WITH_NN: true
PLOT_NN_CHUNK_SIZE: 512000
PLOT_NN_DEVICE: null

BEST_CHECKPOINT_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-best.pt"
LAST_CHECKPOINT_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-last.pt"

# Fine-tune initialization: load weights from the old length-21 checkpoint,
# but start a fresh optimizer and epoch counter.
INIT_CHECKPOINT_PATH: "${OUTPUT_PATH}/${MODEL}-LEN101_FT_STAGE1-best.pt"
INIT_CHECKPOINT_STRICT: true
INIT_CHECKPOINT_FALLBACK_FILTER: true
RESUME_CHECKPOINT: false

TARGET: null
# TARGET: "${DATA_PATH}/targets/chlorophyll_filter_target_reverse.csv"
# TARGET: "d:/Profile/a3536/Eigene Dateien/GitHub/OptoLlama/data/targets/example-thermalreflector_target.csv"

# --- hyperparameters ---
SEED: 3
NUM_WORKERS: 4

D_MODEL: 1024
N_BLOCKS: 6
N_HEADS: 8
DROPOUT: 0.0

LEARNING_RATE: 0.00003
TEMPERATURE: 0.65
TOP_K: 0
TOP_P: 0.90
MC_SAMPLES: 1
N_TARGETS: 20

EPOCHS: 100
DIFFUSION_STEPS: 500
TRACK_DIFFUSION_STEPS_MAE: false
NUM_SAMPLES_TRAIN: 10000000
NUM_SAMPLES_TEST: 100
TRAIN_BATCH_SIZE: 64
TEST_BATCH_SIZE: 8

WAVELENGTH_MIN: 300
WAVELENGTH_MAX: 2000
WAVELENGTH_STEPS: 10
MAX_SEQ_LEN: 101
MAX_EMIT_LEN: ${MAX_SEQ_LEN}

# --- target design ---
NOISE:
  ENABLED: false
  SIGMA_ABS: 0.01
  SIGMA_REL: 0.00
  PER_CHANNEL: [1.0, 0.0, 1.0]
  WL_MIN: 300
  WL_MAX: 2000
  CLIP_0_1: false

SMOOTH:
  ENABLED: false
  METHOD: "gaussian"
  WIN: 10
  SIGMA: 1.50

MISMATCH_FILL_ORDER: "R>T>A"

FILL_OUTSIDE_ROI:
  ENABLED: false
  SKIP_INDEX_0: true
  MODE: "smooth_random"
  STRENGTH: 0.65
  KERNEL_SIZE: 20

# --- evaluation ---
PLOT_NK: true
VALID_SIM: "TMM_FAST"
INCIDENCE_ANGLE: 0
ROI_MIN: 300
ROI_MAX: 2000

TOKEN_FILTER_ENABLED: false
TOKEN_FILTER_MODE: "allow"
TOKEN_FILTER_GROUPS: []
TOKEN_FILTER_EXCLUDE_TOKENS: []
TOKEN_FILTER_ALLOW_TOKENS: ["SiO2", "Ta2O5", "MgO"]
