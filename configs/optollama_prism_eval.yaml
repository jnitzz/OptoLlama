EXPERIMENT:
  MODEL: optollama
  RUN: REALISTIC_07_PRISM_EVAL
  SEED: 3

PATHS:
  DATA_PATH: E:/repos/OptoLlama/data
  MATERIALS_PATH: ${PATHS.DATA_PATH}/materials/
  TOKENS_PATH: ${PATHS.DATA_PATH}/realistic_02_test/tokens.json
  OUTPUT_PATH: ${PATHS.DATA_PATH}/output_${EXPERIMENT.RUN}
  SAMPLES_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-samples.json
  GRID_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-grid.json
  IDS_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-ids.json
  PLOT_BUNDLE_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-plot-bundle.npz
  BEST_CHECKPOINT_PATH: ${PATHS.DATA_PATH}/checkpoints/optollama-REALISTIC_07_20M-best.pt
  LAST_CHECKPOINT_PATH: ${PATHS.DATA_PATH}/checkpoints/optollama-REALISTIC_07_20M-last.pt
  SPECTRUM_AE_CHECKPOINT: ${PATHS.DATA_PATH}/output_REALISTIC_07_20M/spectrum_autoencoder/spectrum_autoencoder-best.pt
  TRAIN:
    - ${PATHS.DATA_PATH}/realistic_07_20M_train_1M
  TEST:
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_20
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_20_10nm
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_20_15nm
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_20_20nm
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_30_10nm
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_40_10nm
    - ${PATHS.DATA_PATH}/prism_optollama/max_len_50_10nm
    - ${PATHS.DATA_PATH}/prism_optollama/max_length_10
    - ${PATHS.DATA_PATH}/prism_optollama/thick_15nm
    - ${PATHS.DATA_PATH}/prism_optollama/thick_20nm

CHECKPOINT:
  INIT_PATH: ${PATHS.DATA_PATH}/checkpoints/optollama-REALISTIC_07_20M-best.pt
  INIT_STRICT: false
  INIT_FALLBACK_FILTER: true
  RESUME: false

DATA_LOADING:
  NUM_WORKERS: 0
  SHARDED_LOADING: true
  NUM_SAMPLES_TRAIN: 0
  # Set to null for the full 120k PRISM validation benchmark.
  NUM_SAMPLES_TEST: 10
  TRAIN_BATCH_SIZE: 64
  TEST_BATCH_SIZE: 128

SPECTRAL_GRID:
  WAVELENGTH_MIN: 300
  WAVELENGTH_MAX: 1700
  WAVELENGTH_STEPS: 5

SEQUENCE:
  MAX_SEQ_LEN: 101
  MAX_EMIT_LEN: ${SEQUENCE.MAX_SEQ_LEN}

MODEL_ARCH:
  D_MODEL: 1536
  N_BLOCKS: 10
  N_HEADS: 12
  DROPOUT: 0.0
  DIFFUSION_STEPS: 500

SPECTRUM_LATENT:
  ENABLED: false
  CHECKPOINT: ${PATHS.SPECTRUM_AE_CHECKPOINT}
  MODE: token
  FREEZE_ENCODER: true

OPTIMIZATION:
  LEARNING_RATE: 0.0001
  EPOCHS: 1

SAMPLING:
  TEMPERATURE: 0.65
  TOP_K: 0
  TOP_P: 0.9
  MC_SAMPLES: 10

INFERENCE:
  TRACK_DIFFUSION_STEPS_MAE: false
  RECORD_ALL_MC: false
  RECORD_PRED_SPECTRA: true
  SHOW_PROGRESS: true
  PROFILE_TIMING: true
  DEDUP_STACKS: true

EVALUATION:
  VALID_SIM: TMM_FAST
  TMM_DEVICE: cpu
  INCIDENCE_ANGLE: 0
  ROI_MIN: 400
  ROI_MAX: 1100
  MAE_CHANNELS:
    - R
    - T
  COMMON_MAE:
    ENABLED: true
    WAVELENGTH_MIN: 400
    WAVELENGTH_MAX: 1100
    WAVELENGTH_STEPS: 10

TARGET_SELECTION:
  TARGET: null
  TARGETS: []
  TARGET_GLOB: []
  N_TARGETS: 1

TARGET_PREPROCESS:
  MISMATCH_FILL_ORDER: R>T>A
  NOISE:
    ENABLED: false
    SIGMA_ABS: 0.01
    SIGMA_REL: 0.0
    PER_CHANNEL:
      - 1.0
      - 0.0
      - 1.0
    WL_MIN: 300
    WL_MAX: 1700
    CLIP_0_1: false
  SMOOTH:
    ENABLED: false
    METHOD: gaussian
    WIN: 10
    SIGMA: 1.5
  FILL_OUTSIDE_ROI:
    ENABLED: false
    SKIP_INDEX_0: true
    MODE: smooth_random
    STRENGTH: 0.65
    KERNEL_SIZE: 20

PLOTTING:
  SAMPLE_WITH_NN: false
  NN_CHUNK_SIZE: 512000
  NN_DEVICE: null
  NK: false

TOKEN_FILTER:
  ENABLED: false
  MODE: allow
  GROUPS: []
  EXCLUDE_TOKENS: []
  ALLOW_TOKENS: []

REALISTIC_TMM:
  ENABLED: true
  ANGLES:
    - 0.0
  ANGLE_WEIGHTS:
    - 1.0
  POLARIZATIONS:
    - s
  JITTER_REALIZATIONS: 1
  THICKNESS_JITTER_NM: 0.0

TARGET_PHYSICALIZE:
  ENABLED: false
