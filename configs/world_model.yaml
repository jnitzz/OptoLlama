MODEL: "optollama"
RUN: "WORLD"

# --- shared OptoLlama paths ---
DATA_PATH: "E:/repos/OptoLlama/data"
TOKENS_PATH: "${DATA_PATH}/tokens.json"
MATERIALS_PATH: "${DATA_PATH}/materials/"

DATA_PATH_TRAIN_0: "${DATA_PATH}/train/train-0.safetensors"
DATA_PATH_TRAIN_1: "${DATA_PATH}/train/train-1.safetensors"
DATA_PATH_TRAIN_2: "${DATA_PATH}/train/train-2.safetensors"
DATA_PATH_TRAIN_3: "${DATA_PATH}/train/train-3.safetensors"
DATA_PATH_TRAIN_4: "${DATA_PATH}/train/train-4.safetensors"
DATA_PATH_TRAIN_5: "${DATA_PATH}/train/train-5.safetensors"
DATA_PATH_TRAIN_6: "${DATA_PATH}/train/train-6.safetensors"
DATA_PATH_TRAIN_7: "${DATA_PATH}/train/train-7.safetensors"
DATA_PATH_TRAIN_8: "${DATA_PATH}/train/train-8.safetensors"
DATA_PATH_TRAIN_9: "${DATA_PATH}/train/train-9.safetensors"
DATA_PATH_TEST: "${DATA_PATH}/test/test.safetensors"

OUTPUT_PATH: "${DATA_PATH}/output"
BEST_CHECKPOINT_PATH: "${OUTPUT_PATH}/${MODEL}.pt"
SAMPLES_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-samples.json"
GRID_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-grid.json"
IDS_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-ids.json"
PLOT_BUNDLE_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-plot-bundle.npz"
PLOT_SAMPLE_WITH_NN: false
PLOT_NN_CHUNK_SIZE: 512000
PLOT_NN_DEVICE: null

# Optional target for planner runs.
TARGET: "${DATA_PATH}/targets/chlorophyll_filter_target_reverse.csv"

# --- base OptoLlama hyperparameters needed to load the proposal model ---
SEED: 3
NUM_WORKERS: 4
D_MODEL: 1024
N_BLOCKS: 6
N_HEADS: 8
DROPOUT: 0.0
TEMPERATURE: 0.65
TOP_K: 0
TOP_P: 0.90
MC_SAMPLES: 10
N_TARGETS: 1
DIFFUSION_STEPS: 500
TRAIN_BATCH_SIZE: 256
TEST_BATCH_SIZE: 16
WAVELENGTH_MIN: 300
WAVELENGTH_MAX: 2000
WAVELENGTH_STEPS: 10
MAX_SEQ_LEN: 21
MAX_EMIT_LEN: ${MAX_SEQ_LEN}
VALID_SIM: "TMM_FAST"
INCIDENCE_ANGLE: 0
ROI_MIN: 300
ROI_MAX: 2000

# Inference-time token filters for proposal/planner pools.
TOKEN_FILTER_ENABLED: false
TOKEN_FILTER_MODE: "allow"
TOKEN_FILTER_GROUPS: []
TOKEN_FILTER_EXCLUDE_TOKENS: []
TOKEN_FILTER_ALLOW_TOKENS: []

# Target augmentation knobs required by RepeatedSpectrumDataset.
NOISE:
  ENABLED: false
  SIGMA_ABS: 0.01
  SIGMA_REL: 0.00
  PER_CHANNEL: [1.0, 0.0, 1.0]
  WL_MIN: 300
  WL_MAX: 2000
  CLIP_0_1: false
SMOOTH:
  ENABLED: false
  METHOD: "gaussian"
  WIN: 10
  SIGMA: 1.50
MISMATCH_FILL_ORDER: "R>T>A"
FILL_OUTSIDE_ROI:
  ENABLED: false
  SKIP_INDEX_0: true
  MODE: "smooth_random"
  STRENGTH: 0.65
  KERNEL_SIZE: 20

# --- world-transition generation ---
WORLD_DEVICE: null
WORLD_TRANSITION_OUTPUT_PATH: "${DATA_PATH}/world_transitions/train"
WORLD_SOURCE_SPLIT: "train"
WORLD_NUM_BASE_SAMPLES: 4096
WORLD_NUM_TRANSITIONS: 32768
WORLD_SHARD_SIZE: 8192
WORLD_GENERATE_BATCH_SIZE: 64
WORLD_EVAL_BATCH_SIZE: 512
WORLD_OUTPUT_SEQ_LEN: ${MAX_SEQ_LEN}
WORLD_MAX_LAYERS: 20
WORLD_CURRENT_EDITS: 2
WORLD_NEXT_EDITS: 1
WORLD_NUM_NEXT_PERTURBATIONS: 4
WORLD_INCLUDE_ANCHOR_REPAIR: true
WORLD_ALLOWED_GROUPS: null
WORLD_EXCLUDE_MATERIALS: null
WORLD_EXCLUDE_TOKENS: null

# --- world-model train data ---
WORLD_DATA_PATH_TRAIN_0: "${DATA_PATH}/world_transitions/train"
# Add WORLD_DATA_PATH_TEST_0 when you generate a held-out transition set.

# --- world-model architecture/training ---
WORLD_D_MODEL: 256
WORLD_N_HEADS: 4
WORLD_STACK_LAYERS: 2
WORLD_DROPOUT: 0.05
WORLD_EPOCHS: 20
WORLD_LEARNING_RATE: 0.0001
WORLD_WEIGHT_DECAY: 0.000001
WORLD_GRAD_CLIP: 1.0
WORLD_TRAIN_BATCH_SIZE: 256
WORLD_TEST_BATCH_SIZE: 256
WORLD_NUM_SAMPLES_TRAIN: null
WORLD_NUM_SAMPLES_TEST: null
WORLD_COST_LOSS_WEIGHT: 1.0
WORLD_DELTA_LOSS_WEIGHT: 1.0
WORLD_SPECTRUM_LOSS_WEIGHT: 0.1
WORLD_CHECKPOINT_PATH: "${OUTPUT_PATH}/world-edit-scorer.pt"
WORLD_LAST_CHECKPOINT_PATH: "${OUTPUT_PATH}/world-edit-scorer-last.pt"

# --- planner ---
WORLD_PLANNER_OUTPUT_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-world-planner.json"
WORLD_PLANNER_MAX_TARGETS: 1
WORLD_PLANNER_MC_SAMPLES: 10
WORLD_PLANNER_BEAM_SIZE: 4
WORLD_PLANNER_ROUNDS: 2
WORLD_PLANNER_NUM_PERTURBATIONS: 64
WORLD_PLANNER_EDITS_PER_PERTURBATION: 1
WORLD_PLANNER_VERIFY_PER_TARGET: 8
WORLD_PLANNER_BATCH_SIZE: 1024
