MODEL: "optollama"
RUN: "REALISTIC_LEN101"

# --- paths ---
DATA_PATH: "E:/repos/OptoLlama/data"
MATERIALS_PATH: "${DATA_PATH}/materials/"

# The realistic generator writes this 5 nm vocabulary next to the dataset.
# Use this config for training only after generating the dataset once.
TOKENS_PATH: "${REALISTIC_DATASET.OUT_DIR}/tokens.json"

DATA_PATH_TRAIN_0: "${REALISTIC_DATASET.OUT_DIR}"
DATA_PATH_TEST: "${DATA_PATH}/realistic_len100_test"

OUTPUT_PATH: "${DATA_PATH}/output_${RUN}"
SAMPLES_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-samples.json"
GRID_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-grid.json"
IDS_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-ids.json"
PLOT_BUNDLE_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-plot-bundle.npz"
PLOT_SAMPLE_WITH_NN: true
PLOT_NN_CHUNK_SIZE: 512000
PLOT_NN_DEVICE: null

BEST_CHECKPOINT_PATH: "${DATA_PATH}/checkpoints/${MODEL}-${RUN}-best.pt"
LAST_CHECKPOINT_PATH: "${DATA_PATH}/checkpoints/${MODEL}-${RUN}-last.pt"

# Keep null by default because the realistic setup changes both the vocabulary
# size and spectral input width. Set this manually if you want filtered init
# from an older checkpoint.
INIT_CHECKPOINT_PATH: null
INIT_CHECKPOINT_STRICT: true
INIT_CHECKPOINT_FALLBACK_FILTER: true
RESUME_CHECKPOINT: false

TARGET: null

# --- hyperparameters ---
SEED: 3
NUM_WORKERS: 4

D_MODEL: 1024
N_BLOCKS: 6
N_HEADS: 8
DROPOUT: 0.0

LEARNING_RATE: 0.0001
TEMPERATURE: 0.65
TOP_K: 0
TOP_P: 0.90
MC_SAMPLES: 10
N_TARGETS: 1

EPOCHS: 1000
DIFFUSION_STEPS: 500
TRACK_DIFFUSION_STEPS_MAE: false
NUM_SAMPLES_TRAIN: 10000000
NUM_SAMPLES_TEST: 10000
TRAIN_BATCH_SIZE: 128
TEST_BATCH_SIZE: 128

WAVELENGTH_MIN: 300
WAVELENGTH_MAX: 1700
WAVELENGTH_STEPS: 5
MAX_SEQ_LEN: 101
MAX_EMIT_LEN: ${MAX_SEQ_LEN}

# --- realistic dataset generation ---
REALISTIC_DATASET:
  OUT_DIR: "${DATA_PATH}/realistic_len100"
  NUM_SAMPLES: 128
  SHARD_SIZE: 128
  BATCH_SIZE: 128
  SEED: ${SEED}
  DEVICE: "cuda"
  OVERWRITE: false

  MIN_LAYERS: 0
  MAX_LAYERS: 100
  OUTPUT_SEQ_LEN: ${MAX_SEQ_LEN}
  DBR_MIN_LAYERS: 2
  CHIRPED_DBR_MIN_LAYERS: 2
  CAVITY_MIN_LAYERS: 5
  CENTER_MIN: ${WAVELENGTH_MIN}
  CENTER_MAX: ${WAVELENGTH_MAX}
  STRUCTURE_JITTER_FRACTION: 0.0

  THICKNESS_MIN: 10
  THICKNESS_MAX: 500
  THICKNESS_STEP: 5

  WAVELENGTH_MIN: ${WAVELENGTH_MIN}
  WAVELENGTH_MAX: ${WAVELENGTH_MAX}
  WAVELENGTH_STEP: ${WAVELENGTH_STEPS}

  ANGLES: [0.0, 4.0, 8.0]
  ANGLE_WEIGHTS: [1.0, 1.0, 1.0]
  POLARIZATIONS: ["s"]
  JITTER_REALIZATIONS: 3
  THICKNESS_JITTER_NM: 3.0
  SAVE_DTYPE: "float16"

# Use the same optical forward model during inference/validation as was used
# to produce the realistic training spectra.
REALISTIC_TMM:
  ENABLED: true
  ANGLES: ${REALISTIC_DATASET.ANGLES}
  ANGLE_WEIGHTS: ${REALISTIC_DATASET.ANGLE_WEIGHTS}
  POLARIZATIONS: ${REALISTIC_DATASET.POLARIZATIONS}
  JITTER_REALIZATIONS: ${REALISTIC_DATASET.JITTER_REALIZATIONS}
  THICKNESS_JITTER_NM: ${REALISTIC_DATASET.THICKNESS_JITTER_NM}

# --- target design ---
NOISE:
  ENABLED: false
  SIGMA_ABS: 0.01
  SIGMA_REL: 0.00
  PER_CHANNEL: [1.0, 0.0, 1.0]
  WL_MIN: 300
  WL_MAX: 1700
  CLIP_0_1: false

SMOOTH:
  ENABLED: false
  METHOD: "gaussian"
  WIN: 10
  SIGMA: 1.50

MISMATCH_FILL_ORDER: "R>T>A"

FILL_OUTSIDE_ROI:
  ENABLED: false
  SKIP_INDEX_0: true
  MODE: "smooth_random"
  STRENGTH: 0.65
  KERNEL_SIZE: 20

# --- evaluation ---
PLOT_NK: true
VALID_SIM: "TMM_FAST"
INCIDENCE_ANGLE: 0
ROI_MIN: 300
ROI_MAX: 1700

TOKEN_FILTER_ENABLED: false
TOKEN_FILTER_MODE: "allow"
TOKEN_FILTER_GROUPS: []
TOKEN_FILTER_EXCLUDE_TOKENS: []
TOKEN_FILTER_ALLOW_TOKENS: []
