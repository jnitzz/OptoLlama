EXPERIMENT:
  MODEL: optollama
  RUN: REALISTIC_14_DEPTH_FIELD_10UM
  SEED: 3

PATHS:
  DATA_PATH: /scratch/htc/jschaibl/repos/OptoLlama/data
  MATERIALS_PATH: ${PATHS.DATA_PATH}/materials/
  TOKENS_PATH: ${PATHS.DATA_PATH}/realistic_02_test/tokens.json
  OUTPUT_PATH: ${PATHS.DATA_PATH}/output_${EXPERIMENT.RUN}
  SAMPLES_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-samples.json
  GRID_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-grid.json
  IDS_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-ids.json
  PLOT_BUNDLE_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-plot-bundle.npz
  BEST_CHECKPOINT_PATH: ${PATHS.DATA_PATH}/checkpoints/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-best.pt
  LAST_CHECKPOINT_PATH: ${PATHS.DATA_PATH}/checkpoints/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-last.pt
  TRAIN:
    - ${PATHS.DATA_PATH}/realistic_07_20M_train
  TEST:
    - ${PATHS.DATA_PATH}/realistic_07_20M_test

CHECKPOINT:
  INIT_PATH: null
  INIT_STRICT: true
  INIT_FALLBACK_FILTER: true
  RESUME: false

DATA_LOADING:
  NUM_WORKERS: 8
  SHARDED_LOADING: true
  NUM_SAMPLES_TRAIN: 20000000
  NUM_SAMPLES_TEST: 256
  TRAIN_BATCH_SIZE: 1024
  TEST_BATCH_SIZE: 16

SPECTRAL_GRID:
  WAVELENGTH_MIN: 300
  WAVELENGTH_MAX: 1700
  WAVELENGTH_STEPS: 5

SEQUENCE:
  MAX_SEQ_LEN: 101
  MAX_EMIT_LEN: ${SEQUENCE.MAX_SEQ_LEN}

MODEL_ARCH:
  D_MODEL: 1024
  N_BLOCKS: 6
  N_HEADS: 8
  DROPOUT: 0.0
  DIFFUSION_STEPS: 500
  DEPTH_POSITION:
    ENABLED: false
    SCALE_NM: 1000
    MASK_THICKNESS_NM: null
    LAYER_CENTERS: true
  DEPTH_ROPE:
    ENABLED: true
    SCALE_NM: 1000
    BASE: 10000
    LAYER_CENTERS: true
  FACTORED_OUTPUT:
    ENABLED: true
    MATERIAL_VOCAB_MODE: true
    THICKNESS_LOSS_WEIGHT: 0.75
    TOTAL_THICKNESS_LOSS_WEIGHT: 0.01
    ACTIVE_GATE_ENABLED: true
    ACTIVE_LOSS_WEIGHT: 0.05
    ACTIVE_SPARSITY_WEIGHT: 0.001
    JOINT_CE_WEIGHT: 0.0
    MATERIAL_LABEL_SMOOTHING: 0.05
    THICKNESS_LOG_SIGMA: 0.50
    CONTINUOUS_THICKNESS:
      ENABLED: true
      USE_FOR_TMM: true
      SAVE_IN_RESULTS: true
      ROUND_STEP_NM: null
      MIN_NM: 10
      MAX_NM: 500
      STATE_ENABLED: true
      STATE_NOISE_LOG_STD: 0.30
      STATE_INIT_NM: 200

DEPTH_FIELD:
  ENABLED: true
  OUT_DIR: ${PATHS.DATA_PATH}/checkpoints/depth_field_10um_r14
  DZ_NM: 10
  MAX_THICKNESS_NM: 10000
  MODEL:
    D_MODEL: 1024
    N_BLOCKS: 12
    KERNEL_SIZE: 7
    DROPOUT: 0.0
    DIFFUSION_STEPS: 100
  TRAIN:
    AMP: true
    WEIGHT_DECAY: 0.01
    GRAD_CLIP: 1.0
    KEEP_OVERLIMIT_STACKS: false
    VOID_LOSS_WEIGHT: 0.25
    RANDOM_REPLACE_PROB: 0.10
    LOSS_ON_CORRUPTED_ONLY: false
  EVAL:
    MODE: tmm
    MC_SAMPLES: 4
    SAMPLING_STEPS: 100
    TEMPERATURE: 1.0
    TOP_K: 0
    DETERMINISTIC: false
    TMM_DEVICE: auto
    TMM_BATCH_SIZE: 64

SPECTRUM_LATENT:
  ENABLED: false
  CHECKPOINT: ${PATHS.OUTPUT_PATH}/spectrum_autoencoder/spectrum_autoencoder-best.pt
  MODE: token
  FREEZE_ENCODER: true

OPTIMIZATION:
  LEARNING_RATE: 0.0001
  EPOCHS: 1000

SAMPLING:
  TEMPERATURE: 0.65
  TOP_K: 0
  TOP_P: 0.9
  MC_SAMPLES: 10

INFERENCE:
  TRACK_DIFFUSION_STEPS_MAE: false
  RECORD_ALL_MC: false
  RECORD_PRED_SPECTRA: true
  SHOW_PROGRESS: true
  PROFILE_TIMING: true
  DEDUP_STACKS: true

VALIDATION:
  # 0 disables mid-epoch validation. Set e.g. 1000000 to validate after
  # each million globally processed training samples while still finishing
  # the full configured epoch.
  EVERY_N_TRAIN_SAMPLES: 50000
  AT_EPOCH_END: true

EVALUATION:
  VALID_SIM: TMM_FAST
  INCIDENCE_ANGLE: 0
  ROI_MIN: 300
  ROI_MAX: 1700
  COMMON_MAE:
    ENABLED: true
    WAVELENGTH_MIN: 300
    WAVELENGTH_MAX: 1700
    WAVELENGTH_STEPS: 10

TARGET_SELECTION:
  TARGET: null
  # TARGET_GLOB: ${PATHS.DATA_PATH}/targets/multicolor_realistic/*.csv
  # TARGET: ${PATHS.DATA_PATH}/targets/multicolor_realistic/target_R_peak_blue_realistic.csv
  # TARGET: ${PATHS.DATA_PATH}/targets/multicolor_realistic/target_R_peak_yellow_realistic.csv
  # TARGET: ${PATHS.DATA_PATH}/targets/target_R_BR_realistic.csv
  # TARGET: ${PATHS.DATA_PATH}/targets/target_R_B_realistic.csv
  N_TARGETS: 1

TARGET_PREPROCESS:
  MISMATCH_FILL_ORDER: R>T>A
  NOISE:
    ENABLED: false
    SIGMA_ABS: 0.01
    SIGMA_REL: 0.0
    PER_CHANNEL:
      - 1.0
      - 0.0
      - 1.0
    WL_MIN: 300
    WL_MAX: 1700
    CLIP_0_1: false
  SMOOTH:
    ENABLED: false
    METHOD: gaussian
    WIN: 10
    SIGMA: 1.5
  FILL_OUTSIDE_ROI:
    ENABLED: false
    SKIP_INDEX_0: true
    MODE: smooth_random
    STRENGTH: 0.65
    KERNEL_SIZE: 20

PLOTTING:
  SAMPLE_WITH_NN: true
  NN_CHUNK_SIZE: 512000
  NN_DEVICE: null
  NK: true

TOKEN_FILTER:
  ENABLED: false
  MODE: allow
  GROUPS: []
  EXCLUDE_TOKENS: []
  ALLOW_TOKENS: []

REALISTIC_TMM:
  ENABLED: true
  ANGLES: ${REALISTIC_DATASET.REALISTIC_AVERAGING.ANGLES}
  ANGLE_WEIGHTS: ${REALISTIC_DATASET.REALISTIC_AVERAGING.ANGLE_WEIGHTS}
  POLARIZATIONS: ${REALISTIC_DATASET.REALISTIC_AVERAGING.POLARIZATIONS}
  JITTER_REALIZATIONS: ${REALISTIC_DATASET.REALISTIC_AVERAGING.JITTER_REALIZATIONS}
  THICKNESS_JITTER_NM: ${REALISTIC_DATASET.REALISTIC_AVERAGING.THICKNESS_JITTER_NM}

TARGET_PHYSICALIZE:
  ENABLED: true
  SELECTION_TARGET: original
  EDGE_SMOOTHING:
    ENABLED: false
    SIGMA_NM: 20
    WIN_NM: 80
  LEVEL_RELAXATION:
    ENABLED: false
    PASS_VALUE: 0.98
    STOP_VALUE: 0.02
    ABS_SCALE: 1.0
  AE_PROJECT:
    ENABLED: true
    CHECKPOINT: ${PATHS.OUTPUT_PATH}/spectrum_autoencoder/spectrum_autoencoder-best.pt
    DEVICE: null
    MODE: all
    BLEND: 1.0
    ROI_BLEND: 0.0
    OUTSIDE_ROI_BLEND: 0.8
    TRANSITION_BLEND: 0.4
    TRANSITION_WIDTH_NM: 200
  NN_BLEND:
    ENABLED: false
    SOURCE_SPLIT: train
    SOURCE_PATHS: []
    CHUNK_SIZE: 512000
    DEVICE: null
    METRIC_ROI_MIN: ${EVALUATION.ROI_MIN}
    METRIC_ROI_MAX: ${EVALUATION.ROI_MAX}
    METRIC_CHANNELS:
      - R
      - T
      - A
    MODE: outside_roi
    ROI_BLEND: 0.0
    OUTSIDE_ROI_BLEND: 0.8
    TRANSITION_BLEND: 0.4
    TRANSITION_WIDTH_NM: 200

REALISTIC_DATASET:
  OUT_DIR: ${PATHS.DATA_PATH}/realistic_var
  NUM_SAMPLES: 21000000
  SHARD_SIZE: 100000
  BATCH_SIZE: 512
  FAMILY_WEIGHTS:
    random_dielectric: 0.30
    random: 0.20
    sparse_metal_random: 0.08
    dbr: 0.05
    chirped_dbr: 0.04
    cavity: 0.04
    rugate: 0.05
    apodized_dbr: 0.04
    multi_cavity: 0.04
    edge_filter: 0.04
    multi_band_filter: 0.04
    metal_dielectric_metal: 0.02
    dielectric_metal_dielectric: 0.02
    absorber_backed: 0.01
    hybrid_dbr_metal: 0.01
    tco_stack: 0.02
  SEED: ${EXPERIMENT.SEED}
  DEVICE: cuda
  OVERWRITE: true
  LAYERS:
    MIN: 0
    MAX: 100
    OUTPUT_SEQ_LEN: ${SEQUENCE.MAX_SEQ_LEN}
    FAMILY_MIN_LAYERS:
      DBR: 2
      CHIRPED_DBR: 2
      CAVITY: 5
      SYMMETRIC_MOTIF: 4
      RUGATE: 8
      APODIZED_DBR: 4
      MULTI_CAVITY: 7
      EDGE_FILTER: 4
      MULTI_BAND_FILTER: 6
      METAL_DIELECTRIC_METAL: 3
      DIELECTRIC_METAL_DIELECTRIC: 3
      ABSORBER_BACKED: 2
      HYBRID_DBR_METAL: 3
      SPARSE_METAL_RANDOM: 3
      TCO_STACK: 3
  THICKNESS:
    MIN: 10
    MAX: 500
    STEP: 5
  SPECTRUM:
    WAVELENGTH_MIN: ${SPECTRAL_GRID.WAVELENGTH_MIN}
    WAVELENGTH_MAX: ${SPECTRAL_GRID.WAVELENGTH_MAX}
    WAVELENGTH_STEP: ${SPECTRAL_GRID.WAVELENGTH_STEPS}
  REALISTIC_AVERAGING:
    ANGLES:
      - 0.0
      - 8.0
    ANGLE_WEIGHTS:
      - 1.0
      - 1.0
    POLARIZATIONS:
      - s
    JITTER_REALIZATIONS: 3
    THICKNESS_JITTER_NM: 2.5
    SAVE_DTYPE: float16
  STRUCTURES:
    CENTER_MIN: 100
    CENTER_MAX: 2200
    STRUCTURE_JITTER_FRACTION: 0.10
