MODEL: "optollama"
RUN: "WORLD_LEN101"

# --- shared OptoLlama paths ---
DATA_PATH: "E:/repos/OptoLlama/data"
TOKENS_PATH: "${DATA_PATH}/tokens.json"
MATERIALS_PATH: "${DATA_PATH}/materials/"

DATA_PATH_TRAIN_0: "${DATA_PATH}/train_len101"
DATA_PATH_TEST: "${DATA_PATH}/test_len101"

OUTPUT_PATH: "${DATA_PATH}/output_${RUN}"
BEST_CHECKPOINT_PATH: "${DATA_PATH}/checkpoints/optollama-LEN101_FT20_00-best.pt"
SAMPLES_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-samples.json"
GRID_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-grid.json"
IDS_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-ids.json"
PLOT_BUNDLE_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-plot-bundle.npz"
PLOT_SAMPLE_WITH_NN: true
PLOT_NN_CHUNK_SIZE: 512000
PLOT_NN_DEVICE: null

TARGET: "${DATA_PATH}/targets/target_T_BR.csv"

# --- length-101 OptoLlama proposal model ---
SEED: 3
NUM_WORKERS: 4
D_MODEL: 1200
N_BLOCKS: 8
N_HEADS: 8
DROPOUT: 0.0
TEMPERATURE: 0.65
TOP_K: 0
TOP_P: 0.90
MC_SAMPLES: 10
N_TARGETS: 1
DIFFUSION_STEPS: 500
TRAIN_BATCH_SIZE: 256
TEST_BATCH_SIZE: 256
WAVELENGTH_MIN: 300
WAVELENGTH_MAX: 2000
WAVELENGTH_STEPS: 10
MAX_SEQ_LEN: 101
MAX_EMIT_LEN: ${MAX_SEQ_LEN}
VALID_SIM: "TMM_FAST"
INCIDENCE_ANGLE: 0
ROI_MIN: 350
ROI_MAX: 1300

TOKEN_FILTER_ENABLED: false
TOKEN_FILTER_MODE: "allow"
TOKEN_FILTER_GROUPS: []
TOKEN_FILTER_EXCLUDE_TOKENS: []
TOKEN_FILTER_ALLOW_TOKENS: ["SiO2", "Ta2O5", "MgO"]

NOISE:
  ENABLED: false
  SIGMA_ABS: 0.01
  SIGMA_REL: 0.00
  PER_CHANNEL: [1.0, 0.0, 1.0]
  WL_MIN: 300
  WL_MAX: 2000
  CLIP_0_1: false
SMOOTH:
  ENABLED: true
  METHOD: "gaussian"
  WIN: 10
  SIGMA: 1.0
MISMATCH_FILL_ORDER: "R>T>A"
FILL_OUTSIDE_ROI:
  ENABLED: true
  SKIP_INDEX_0: true
  MODE: "smooth_random"
  STRENGTH: 0.65
  KERNEL_SIZE: 20

# --- proposal-seeded transition generation ---
WORLD_DEVICE: null
WORLD_TRANSITION_OUTPUT_PATH: "${DATA_PATH}/world_transitions_len101/train"
WORLD_SOURCE_SPLIT: "train"
WORLD_STATE_SOURCE: "proposal"
WORLD_PROPOSAL_CHECKPOINT_PATH: ${BEST_CHECKPOINT_PATH}
WORLD_PROPOSAL_MC_SAMPLES: 16
WORLD_PROPOSAL_KEEP_CANDIDATES: 4
WORLD_NUM_BASE_SAMPLES: 5000
WORLD_NUM_TRANSITIONS: 100000
WORLD_SHARD_SIZE: 8192
WORLD_GENERATE_BATCH_SIZE: 16
WORLD_EVAL_BATCH_SIZE: 256
WORLD_OUTPUT_SEQ_LEN: ${MAX_SEQ_LEN}
WORLD_MAX_LAYERS: 100
WORLD_CURRENT_EDITS: 2
WORLD_NEXT_EDITS: 2
WORLD_NUM_NEXT_PERTURBATIONS: 4
WORLD_INCLUDE_ANCHOR_REPAIR: false
WORLD_ALLOWED_GROUPS: null
WORLD_EXCLUDE_MATERIALS: null
WORLD_EXCLUDE_TOKENS: null

WORLD_MUTATION_INSERT_PROB: 0.20
WORLD_MUTATION_MATERIAL_PROB: 0.20
WORLD_MUTATION_THICKNESS_PROB: 0.35
WORLD_MUTATION_DELETE_PROB: 0.05
WORLD_MUTATION_PAIR_INSERT_PROB: 0.25
WORLD_MUTATION_SWAP_PROB: 0.05
WORLD_MUTATION_SCALE_PROB: 0.15
WORLD_MUTATION_THICKNESS_DELTAS: [-80, -60, -40, -20, -10, 10, 20, 40, 60, 80]
WORLD_MUTATION_SCALE_FACTORS: [0.8, 0.9, 0.95, 1.05, 1.1, 1.2]

# --- world-model train data ---
WORLD_DATA_PATH_TRAIN_0: "${DATA_PATH}/world_transitions_len101/train"
# Generate and uncomment this for held-out scoring:
# WORLD_DATA_PATH_TEST_0: "${DATA_PATH}/world_transitions_len101/test"

WORLD_D_MODEL: 512
WORLD_N_HEADS: 8
WORLD_STACK_LAYERS: 4
WORLD_DROPOUT: 0.05
WORLD_EPOCHS: 30
WORLD_LEARNING_RATE: 0.0001
WORLD_WEIGHT_DECAY: 0.000001
WORLD_GRAD_CLIP: 1.0
WORLD_TRAIN_BATCH_SIZE: 256
WORLD_TEST_BATCH_SIZE: 256
WORLD_NUM_SAMPLES_TRAIN: null
WORLD_NUM_SAMPLES_TEST: null
WORLD_COST_LOSS_WEIGHT: 1.0
WORLD_DELTA_LOSS_WEIGHT: 1.0
WORLD_SPECTRUM_LOSS_WEIGHT: 0.1
WORLD_CHECKPOINT_PATH: "${OUTPUT_PATH}/world-edit-scorer-len101.pt"
WORLD_LAST_CHECKPOINT_PATH: "${OUTPUT_PATH}/world-edit-scorer-len101-last.pt"

# --- delta-aware planner ---
WORLD_PLANNER_OUTPUT_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-world-planner.json"
WORLD_PLANNER_MAX_TARGETS: 1
WORLD_PLANNER_MC_SAMPLES: 16
WORLD_PLANNER_BEAM_SIZE: 12
WORLD_PLANNER_ROUNDS: 8
WORLD_PLANNER_NUM_PERTURBATIONS: 512
WORLD_PLANNER_EDITS_PER_PERTURBATION: 2
WORLD_PLANNER_VERIFY_PER_TARGET: 32
WORLD_PLANNER_EXPLORE_PER_TARGET: 6
WORLD_PLANNER_SCORE_COST_WEIGHT: 0.5
WORLD_PLANNER_SCORE_DELTA_WEIGHT: 0.5
WORLD_PLANNER_BATCH_SIZE: 1024
