EXPERIMENT:
  MODEL: open_layer_flow
  RUN: OPEN_LAYER_FLOW_07_REPLAY_DIAGNOSTIC
  SEED: 3

PATHS:
  DATA_PATH: /scratch/htc/jschaibl/repos/OptoLlama/data
  MATERIALS_PATH: ${PATHS.DATA_PATH}/materials/
  TOKENS_PATH: ${PATHS.DATA_PATH}/realistic_02_test/tokens.json
  OUTPUT_PATH: ${PATHS.DATA_PATH}/output_${EXPERIMENT.RUN}
  TRAIN:
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/00
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/01
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/02
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/03
  TEST:
    - ${PATHS.DATA_PATH}/realistic_10um_20M_test

DATA_LOADING:
  NUM_WORKERS: 0
  SHARDED_LOADING: true
  NUM_SAMPLES_TRAIN: 20000000
  NUM_SAMPLES_TEST: 512
  # Match job 4292091: four ranks and 1024 samples per global optimizer step.
  TRAIN_BATCH_SIZE: 256
  TEST_BATCH_SIZE: 16

SPECTRAL_GRID:
  WAVELENGTH_MIN: 300
  WAVELENGTH_MAX: 1700
  WAVELENGTH_STEPS: 5

CHECKPOINT:
  # open-layer-best.pt was written after epoch 7 and includes optimizer state.
  RESUME: ${PATHS.DATA_PATH}/output_OPEN_LAYER_FLOW_07_COUPLED/open-layer-best.pt

OPEN_LAYER:
  OUT_DIR: ${PATHS.OUTPUT_PATH}
  MAX_LAYERS: 100
  MERGE_ADJACENT: true

  MODEL:
    D_MODEL: 512
    N_BLOCKS: 20
    N_HEADS: 8
    FFN_MULTIPLIER: 4.0
    QUERY_ENCODER_BLOCKS: 2
    DROPOUT: 0.0
    ADALN_ZERO: true
    BRANCH_SPECIFIC_ADALN: true
    TIME_INJECTION: adaln_only
    NORMALIZE_TIME_EMBEDDING: true
    ADALN_SHIFT_LIMIT: 2.0
    ADALN_SCALE_LIMIT: 1.0
    ADALN_GATE_LIMIT: 1.0
    THICKNESS_HEAD:
      MATERIAL_CONTEXT: predicted_soft
      MATERIAL_CONTEXT_GRADIENT: false

  QUERY:
    CHANNELS: [R, T]
    MIN_POINTS: 64
    MAX_POINTS: 281
    SAMPLING: mixed
    SYNC_SHAPES_ACROSS_RANKS: true
    WAVELENGTH_SCALE_NM: 1000
    FOURIER_BANDS: 4
    MATERIAL_COVERAGE_TOLERANCE_NM: 100

  MATERIAL_BANK:
    MAX_CANDIDATES: 24
    RANDOMIZE_ORDER: true
    RANDOM_DISTRACTORS: true
    HOLDOUT_MATERIALS: []

  THICKNESS:
    MIN_NM: 5
    MAX_LAYER_NM: 10000
    MAX_TOTAL_NM: 10000

  DENOISING:
    MATERIAL_PROCESS: full_remask
    THICKNESS_PROCESS: rectified_flow
    TRAIN_TIMESTEPS: 200
    CORRUPTION:
      MODE: hybrid
      IID_FRACTION: 0.30
      SPAN_FRACTION: 0.70
      SPAN_MIN_LAYERS: 2
      SPAN_MAX_LAYERS: 8
      SPAN_SCALE_WITH_NOISE: true
      RANDOM_REPLACE_SCHEDULE: noise_complement
      RANDOM_REPLACE_POWER: 1.0
    RANDOM_REPLACE_PROB: 0.10
    CORRUPTED_LOSS_WEIGHT: 1.0
    UNCORRUPTED_LOSS_WEIGHT: 0.1
    THICKNESS_LOSS_WEIGHT: 1.0
    THICKNESS_HUBER_DELTA: 0.1

  TRAIN:
    # The resumed checkpoint starts at epoch 8. Stop after the instability window.
    EPOCHS: 8
    MAX_TRAIN_STEPS: 12000
    LEARNING_RATE: 0.00005
    WEIGHT_DECAY: 0.01
    GRAD_CLIP: 1.0
    MAX_CONSECUTIVE_NONFINITE_STEPS: 8
    AMP: true
    AMP_DTYPE: auto
    LR_SCHEDULE:
      ENABLED: true
      TYPE: cosine
      WARMUP_SAMPLES: 2000000
      TOTAL_SAMPLES: 400000000
      START_LR: 0.000001
      MAX_LR: 0.00005
      MIN_LR: 0.000001
    DIAGNOSTICS:
      ENABLED: true
      EVERY_N_STEPS: 100
      DIR: diagnostics
      FILE_PREFIX: epoch08-replay

  EVAL:
    # The replay diagnoses training dynamics; exact-TMM MC validation is unnecessary.
    TMM_ENABLED: false
    TMM_DEVICE: same
    TMM_MAX_SAMPLES: 32
    LAYER_COUNTS: [1, 2, 4, 8, 12, 16, 24, 32, 48, 64]
    MC_SAMPLES: 10
    MC_BATCH_SIZE: 10
    SAMPLING_STEPS: 32
    TEMPERATURE: 1.0
    RECORD_SPECTRA: false
    SPECTRA_DIR: validation_spectra

EVALUATION:
  INCIDENCE_ANGLE: 0

REALISTIC_TMM:
  ENABLED: true
  ANGLES: [0.0]
  ANGLE_WEIGHTS: [1.0]
  POLARIZATIONS: [s]
  JITTER_REALIZATIONS: 1
  THICKNESS_JITTER_NM: 0.0

TARGET_SELECTION:
  TARGET: ${PATHS.DATA_PATH}/targets/target_R_BR_realistic.csv
  TARGETS: []
  TARGET_GLOB: null
  N_TARGETS: 1

TARGET_PREPROCESS:
  MISMATCH_FILL_ORDER: R>T>A
  NOISE:
    ENABLED: false
  SMOOTH:
    ENABLED: false
  FILL_OUTSIDE_ROI:
    ENABLED: false
