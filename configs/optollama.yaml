MODEL: "optollama"
RUN: "MD1"

# --- paths ---
DATA_PATH: "E:/repos/OptoLlama/data"

TOKENS_PATH: "${DATA_PATH}/tokens.json"
MATERIALS_PATH: "${DATA_PATH}/materials/"

DATA_PATH_TRAIN_0: "${DATA_PATH}/train/train-0.safetensors"
DATA_PATH_TRAIN_1: "${DATA_PATH}/train/train-1.safetensors"
DATA_PATH_TRAIN_2: "${DATA_PATH}/train/train-2.safetensors"
DATA_PATH_TRAIN_3: "${DATA_PATH}/train/train-3.safetensors"
DATA_PATH_TRAIN_4: "${DATA_PATH}/train/train-4.safetensors"
DATA_PATH_TRAIN_5: "${DATA_PATH}/train/train-5.safetensors"
DATA_PATH_TRAIN_6: "${DATA_PATH}/train/train-6.safetensors"
DATA_PATH_TRAIN_7: "${DATA_PATH}/train/train-7.safetensors"
DATA_PATH_TRAIN_8: "${DATA_PATH}/train/train-8.safetensors"
DATA_PATH_TRAIN_9: "${DATA_PATH}/train/train-9.safetensors"

DATA_PATH_TEST: "${DATA_PATH}/test/test.safetensors"

OUTPUT_PATH: "${DATA_PATH}/output"
SAMPLES_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-samples.json"
GRID_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-grid.json"
IDS_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-ids.json"
PLOT_BUNDLE_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-plot-bundle.npz"
PLOT_SAMPLE_WITH_NN: true
PLOT_NN_CHUNK_SIZE: 512000
# Optional override, e.g. "cpu" or "cuda:0"
PLOT_NN_DEVICE: null
BEST_CHECKPOINT_PATH: "${OUTPUT_PATH}/${MODEL}.pt"
LAST_CHECKPOINT_PATH: "${OUTPUT_PATH}/${MODEL}-${RUN}-last.pt"
INIT_CHECKPOINT_PATH: "${DATA_PATH}/output/optollama.pt"
INIT_CHECKPOINT_STRICT: false
INIT_CHECKPOINT_FALLBACK_FILTER: true
RESUME_CHECKPOINT: true

# Optionally:
# TARGET: "${DATA_PATH}/targets/<YOUR_TARGET>.json"
# TARGET: "d:/Profile/a3536/Eigene Dateien/GitHub/OptoLlama/data/targets/example-thermalreflector_target.csv"
# TARGET: "d:/Profile/a3536/Eigene Dateien/GitHub/OptoLlama/data/targets/transmission_400_1200_target.csv"
# TARGET: "${DATA_PATH}/targets/transmission_400_1200_target.csv"
# TARGET: "${DATA_PATH}/targets/transmission_400_1200_relaxed_target.csv"
# TARGET: "${DATA_PATH}/targets/chlorophyll_filter_target.csv"
# TARGET: "${DATA_PATH}/targets/chlorophyll_filter_target_reverse.csv"
# TARGET: "${DATA_PATH}/targets/target_R_BR.csv"
# TARGET_GLOB: "${DATA_PATH}/targets/plants/*"

# --- hyperparameters ---
SEED: 3
NUM_WORKERS: 4

D_MODEL: 1024
N_BLOCKS: 6
N_HEADS: 8
DROPOUT: 0.0

TEMPERATURE: 0.65
TOP_K: 0
TOP_P: 0.90
MC_SAMPLES: 10
N_TARGETS: 1

EPOCHS: 1000
DIFFUSION_STEPS: 500
TRACK_DIFFUSION_STEPS_MAE: false
NUM_SAMPLES_TRAIN: 3000
NUM_SAMPLES_TEST: 16
TRAIN_BATCH_SIZE: 16
TEST_BATCH_SIZE: 16

WAVELENGTH_MIN: 300
WAVELENGTH_MAX: 2000
WAVELENGTH_STEPS: 10
MAX_SEQ_LEN: 21

# --- target design ---
NOISE:
  ENABLED: false
  SIGMA_ABS: 0.01
  SIGMA_REL: 0.00
  PER_CHANNEL: [1.0, 0.0, 1.0]
  WL_MIN: 300
  WL_MAX: 2000
  CLIP_0_1: false

SMOOTH:
  ENABLED: false
  METHOD: "gaussian"
  WIN: 10
  SIGMA: 1.50

MISMATCH_FILL_ORDER: "R>T>A"

FILL_OUTSIDE_ROI:
  ENABLED: false
  SKIP_INDEX_0: true
  MODE: "smooth_random"
  STRENGTH: 0.65
  KERNEL_SIZE: 20

# --- evaluation ----
PLOT_NK: true
VALID_SIM: "TMM_FAST"
INCIDENCE_ANGLE: 0
ROI_MIN: 300
ROI_MAX: 2000

COMMON_MAE_ENABLED: true
COMMON_MAE_WAVELENGTH_MIN: 300
COMMON_MAE_WAVELENGTH_MAX: 1700
COMMON_MAE_WAVELENGTH_STEPS: 10

MAX_EMIT_LEN: ${MAX_SEQ_LEN} # if smaller than MAX_SEQ_LEN, forces an early EOS at given position, PAD after

TOKEN_FILTER_ENABLED: false
TOKEN_FILTER_MODE: "allow" # "exclude" or "allow"
TOKEN_FILTER_GROUPS: [] # One or more of: ["metals", "semiconductors", "dielectrics"]
# Optional explicit token strings (or ids):
TOKEN_FILTER_EXCLUDE_TOKENS: [] # e.g. ["Ag", "TiN"]
TOKEN_FILTER_ALLOW_TOKENS: ["SiO2", "Ta2O5", "MgO"] # used mainly with TOKEN_FILTER_MODE="allow"
