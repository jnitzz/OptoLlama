EXPERIMENT:
  MODEL: optollama
  RUN: MD1
  SEED: 3
PATHS:
  DATA_PATH: E:/repos/OptoLlama/data
  MATERIALS_PATH: ${PATHS.DATA_PATH}/materials/
  TOKENS_PATH: ${PATHS.DATA_PATH}/tokens.json
  OUTPUT_PATH: ${PATHS.DATA_PATH}/output
  SAMPLES_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-samples.json
  GRID_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-grid.json
  IDS_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-ids.json
  PLOT_BUNDLE_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-plot-bundle.npz
  BEST_CHECKPOINT_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}.pt
  LAST_CHECKPOINT_PATH: ${PATHS.OUTPUT_PATH}/${EXPERIMENT.MODEL}-${EXPERIMENT.RUN}-last.pt
  TRAIN:
    - ${PATHS.DATA_PATH}/train/train-0.safetensors
    - ${PATHS.DATA_PATH}/train/train-1.safetensors
    - ${PATHS.DATA_PATH}/train/train-2.safetensors
    - ${PATHS.DATA_PATH}/train/train-3.safetensors
    - ${PATHS.DATA_PATH}/train/train-4.safetensors
    - ${PATHS.DATA_PATH}/train/train-5.safetensors
    - ${PATHS.DATA_PATH}/train/train-6.safetensors
    - ${PATHS.DATA_PATH}/train/train-7.safetensors
    - ${PATHS.DATA_PATH}/train/train-8.safetensors
    - ${PATHS.DATA_PATH}/train/train-9.safetensors
  TEST:
    - ${PATHS.DATA_PATH}/test/test.safetensors
CHECKPOINT:
  INIT_PATH: ${PATHS.DATA_PATH}/output/optollama.pt
  INIT_STRICT: false
  INIT_FALLBACK_FILTER: true
  RESUME: true
DATA_LOADING:
  NUM_WORKERS: 4
  NUM_SAMPLES_TRAIN: 3000
  NUM_SAMPLES_TEST: 16
  TRAIN_BATCH_SIZE: 16
  TEST_BATCH_SIZE: 16
SPECTRAL_GRID:
  WAVELENGTH_MIN: 300
  WAVELENGTH_MAX: 2000
  WAVELENGTH_STEPS: 10
SEQUENCE:
  MAX_SEQ_LEN: 21
  MAX_EMIT_LEN: ${SEQUENCE.MAX_SEQ_LEN}
MODEL_ARCH:
  D_MODEL: 1024
  N_BLOCKS: 6
  N_HEADS: 8
  DROPOUT: 0.0
  DIFFUSION_STEPS: 500
OPTIMIZATION:
  EPOCHS: 1000
SAMPLING:
  TEMPERATURE: 0.65
  TOP_K: 0
  TOP_P: 0.9
  MC_SAMPLES: 30
INFERENCE:
  TRACK_DIFFUSION_STEPS_MAE: false
EVALUATION:
  VALID_SIM: TMM_FAST
  INCIDENCE_ANGLE: 0
  ROI_MIN: 300
  ROI_MAX: 800
  COMMON_MAE:
    ENABLED: true
    WAVELENGTH_MIN: 300
    WAVELENGTH_MAX: 1700
    WAVELENGTH_STEPS: 10
TARGET_SELECTION:
  TARGET: ${PATHS.DATA_PATH}/targets/multicolor/target_R_peak_yellow.csv
  N_TARGETS: 1
TARGET_PREPROCESS:
  MISMATCH_FILL_ORDER: R>T>A
  NOISE:
    ENABLED: false
    SIGMA_ABS: 0.01
    SIGMA_REL: 0.0
    PER_CHANNEL:
      - 1.0
      - 0.0
      - 1.0
    WL_MIN: 300
    WL_MAX: 2000
    CLIP_0_1: false
  SMOOTH:
    ENABLED: false
    METHOD: gaussian
    WIN: 10
    SIGMA: 1.5
  FILL_OUTSIDE_ROI:
    ENABLED: false
    SKIP_INDEX_0: true
    MODE: smooth_random
    STRENGTH: 0.65
    KERNEL_SIZE: 20
PLOTTING:
  SAMPLE_WITH_NN: true
  NN_CHUNK_SIZE: 512000
  NN_DEVICE: null
  NK: true
TOKEN_FILTER:
  ENABLED: false
  MODE: allow
  GROUPS: []
  EXCLUDE_TOKENS: []
  ALLOW_TOKENS:
    - SiO2
    - Ta2O5
    - MgO
