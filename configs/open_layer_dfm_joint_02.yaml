EXPERIMENT:
  MODEL: open_layer_dfm_joint
  RUN: OPEN_LAYER_DFM_JOINT_02
  SEED: 4

PATHS:
  DATA_PATH: ${oc.env:OPTOLLAMA_DATA_PATH,/scratch/htc/jschaibl/repos/OptoLlama/data}
  MATERIALS_PATH: ${PATHS.DATA_PATH}/materials/
  TOKENS_PATH: ${PATHS.DATA_PATH}/realistic_02_test/tokens.json
  OUTPUT_PATH: ${PATHS.DATA_PATH}/output_${EXPERIMENT.RUN}
  TRAIN:
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/00
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/01
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/02
    - ${PATHS.DATA_PATH}/realistic_10um_20M_train/03
  TEST:
    - ${PATHS.DATA_PATH}/realistic_10um_20M_test

DATA_LOADING:
  NUM_WORKERS: 0
  SHARDED_LOADING: true
  NUM_SAMPLES_TRAIN: 20000000
  NUM_SAMPLES_TEST: 10240
  TRAIN_BATCH_SIZE: 64
  TEST_BATCH_SIZE: 16

SPECTRAL_GRID:
  WAVELENGTH_MIN: 300
  WAVELENGTH_MAX: 1700
  WAVELENGTH_STEPS: 5

CHECKPOINT:
  RESUME: null

OPEN_LAYER_DFM_JOINT:
  OUT_DIR: ${PATHS.OUTPUT_PATH}
  MAX_LAYERS: 100
  THICKNESS:
    MIN_NM: 1.0
    MAX_TOTAL_NM: 10000.0
    ENDPOINT_EPSILON: 0.000001

  QUERY:
    ENABLED: true
    POINTS: 256
    TRAIN_MODE: mixed  # full, window, dual, mixed
    VAL_MODE: full
    MIN_BAND_NM: 100
    MAX_BAND_NM: 900

  MATERIAL_BANK:
    MAX_CANDIDATES: 24
    RANDOMIZE_ORDER: true
    RANDOM_DISTRACTORS: true
    MAX_RANDOM_DISTRACTORS: 8
    FULL_BANK_PROBABILITY: 0.25
    HOLDOUT_MATERIALS: []
    MATERIAL_COVERAGE_TOLERANCE_NM: 100

  OPTICAL_CONDITION:
    ANGLE_DEG: 0.0
    POLARIZATION: s

  MODEL:
    D_MODEL: 512
    N_BLOCKS: 14
    N_HEADS: 8
    FFN_MULTIPLIER: 4.0
    QUERY_ENCODER_BLOCKS: 2
    FP32_ATTENTION: true
    DROPOUT: 0.0

  TRAIN:
    EPOCHS: 50
    LEARNING_RATE: 0.000035
    WEIGHT_DECAY: 0.01
    GRAD_CLIP: 1.0
    COUNT_LOSS_WEIGHT: 1.0
    THICKNESS_LOSS_WEIGHT: 1.0
    CORRECT_VISIBLE_MATERIAL_WEIGHT: 1.0
    VISIBLE_MATERIAL_REPLACE_PEAK: 0.10
    FLOW_TIME_SAMPLING:
      HIGH_NOISE_FRACTION: 0.20  # Fraction drawn from U(0, HIGH_NOISE_MAX_S).
      HIGH_NOISE_MAX_S: 0.35  # Smaller s means more masks; the remainder uses U(0, 1).
    KEEP_EPOCH_CHECKPOINTS: [2, 4, 6, 8]
    MAX_NONFINITE_STEPS_PER_EPOCH: 10
    MAX_CONSECUTIVE_NONFINITE_STEPS: 2
    AMP: true
    AMP_DTYPE: bfloat16
    LOG_EVERY_STEPS: 50
    EVAL_EVERY_STEPS: 10000
    CHECKPOINT_EVERY_STEPS: 10000
    DIAGNOSE_LOCAL_GRADIENTS: true
    COMPILE:
      ENABLED: false
    OPTIMIZER:
      FUSED: true
    DDP:
      STATIC_GRAPH: true
      GRADIENT_AS_BUCKET_VIEW: true
    LR_SCHEDULE:
      ENABLED: true
      TYPE: cosine
      WARMUP_SAMPLES: 2000000
      TOTAL_SAMPLES: 1000000000
      START_LR: 0.000001
      MAX_LR: 0.000035
      MIN_LR: 0.000001
    EMA:
      ENABLED: true
      DECAY: 0.9998
      UPDATE_EVERY_STEPS: 8
      VALIDATE: true

  EVAL:
    SAMPLING_STEPS: 16
    MC_SAMPLES: 4
    FULL_GRID_METRICS: true

EVALUATION:
  INCIDENCE_ANGLE: 0

TARGET_SELECTION:
  TARGET: ${PATHS.DATA_PATH}/targets/target_R_BR_realistic.csv
  TARGETS: []
  TARGET_GLOB: null
  N_TARGETS: 1

TARGET_PREPROCESS:
  MISMATCH_FILL_ORDER: R>T>A
  NOISE:
    ENABLED: false
  SMOOTH:
    ENABLED: false
  FILL_OUTSIDE_ROI:
    ENABLED: false
